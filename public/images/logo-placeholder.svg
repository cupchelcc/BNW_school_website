  <path d="M 97 95 L 103 95 L 105 130 L 95 130 Z" fill="#ffffff"/>
  <!-- Open Book -->
  <path d="M 100 125 C 85 120 70 120 60 125 L 60 145 C 70 140 85 140 100 145 C 115 140 130 140 140 145 L 140 125 C 130 120 115 120 100 125 Z" fill="url(#goldGrad)" stroke="#0b1f3c" stroke-width="2"/>
