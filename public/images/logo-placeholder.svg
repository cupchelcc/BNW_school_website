  </defs>
  <!-- Outer Shield -->
  <path d="M 100 10 L 175 45 C 175 125 100 185 100 185 C 100 185 25 125 25 45 Z" fill="url(#navyGrad)" stroke="url(#goldGrad)" stroke-width="6"/>
